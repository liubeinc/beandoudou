<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼豆色号图生成器 · MARD 221色</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e6e8ee; --text:#1c2128; --mut:#7c8595;
    --pri:#5b6cf0; --pri-2:#7c8cf5; --pri-soft:#eef0fe; --ok:#22a06b;
    --shadow:0 4px 20px rgba(28,40,58,.07); --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  header{background:linear-gradient(120deg,#4f5fe0,#7c5bf0);color:#fff;padding:20px 28px;box-shadow:0 2px 14px rgba(79,95,224,.25)}
  header h1{font-size:21px;font-weight:800;letter-spacing:.5px}
  header p{font-size:13px;opacity:.86;margin-top:4px}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card + .card{margin-top:16px}
  .card h2{font-size:15px;font-weight:800;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .card h2 .step{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  .card h2 .hint{font-size:12px;font-weight:400;color:var(--mut)}
  /* 上传 */
  .drop{border:2px dashed #cdd2e2;border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfe}
  .drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-soft)}
  .drop .big{font-size:30px;line-height:1}
  .drop .t{font-size:14px;font-weight:700;margin-top:8px}
  .drop .s{font-size:12px;color:var(--mut);margin-top:4px}
  .drop input{display:none}
  .preview-thumb{display:none;margin-top:12px;text-align:center}
  .preview-thumb img{max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line)}
  .preview-thumb .meta{font-size:12px;color:var(--mut);margin-top:6px}
  /* 表单控件 */
  .row{margin-bottom:14px}
  .row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
  .row label .val{color:var(--pri);font-weight:800}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#4a5361;transition:.12s;white-space:nowrap}
  .seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  input[type=range]{width:100%;accent-color:var(--pri);height:6px}
  .range-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:2px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
  .check input{accent-color:var(--pri);width:16px;height:16px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(120deg,#5b6cf0,#7c5bf0);color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;letter-spacing:1px}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{background:#c9cede;cursor:not-allowed}
  /* 右侧预览 */
  .right{min-width:0}
  .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .preview-head .dims{font-size:14px;font-weight:700;color:var(--mut)}
  .preview-head .dims b{color:var(--text);font-size:17px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .toolbar button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#4a5361;transition:.12s}
  .toolbar button:hover{border-color:var(--pri);color:var(--pri)}
  .toolbar button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  .stage{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow:auto;text-align:center}
  .stage canvas{max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px}
  .placeholder{color:var(--mut);padding:60px 20px;text-align:center}
  .placeholder .big{font-size:44px}
  .placeholder p{font-size:14px;margin-top:10px}
  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:14px}
  .stat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
  .swatch{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.1);flex:0 0 auto}
  .stat .code{font-size:13px;font-weight:800}
  .stat .n{font-size:12px;color:var(--mut);margin-left:auto}
  .stat .pct{font-size:11px;color:var(--mut)}
  .stat-empty{color:var(--mut);font-size:13px}
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  @media print{
    header,.left{display:none!important}
    .wrap{display:block;padding:0}
    .card,.stage{border:none;box-shadow:none;padding:0}
    .toolbar{display:none!important}
    .right{display:block}
  }
</style>
</head>
<body>
<header>
  <h1>拼豆色号图生成器</h1>
  <p>上传任意图片 → 自动匹配 MARD 漫得 221 色真实色号 → 生成带色号的拼豆图纸</p>
</header>

<div class="wrap">
  <!-- 左：控制面板 -->
  <div class="left">
    <div class="card">
      <h2><span class="step">1</span> 选择原图 <span class="hint">JPG / PNG / WebP / GIF</span></h2>
      <div class="drop" id="drop">
        <div class="big">🖼️</div>
        <div class="t">拖入一张图片</div>
        <div class="s">或点击从电脑选择</div>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="preview-thumb" id="thumb">
        <img id="thumbImg" alt="原图预览">
        <div class="meta" id="thumbMeta"></div>
      </div>
    </div>

    <div class="card" id="settingsCard" style="display:none">
      <h2><span class="step">2</span> 设置图纸</h2>

      <div class="row">
        <label>拼豆规格</label>
        <div class="seg" id="beadSize">
          <button data-v="5">标准豆 · 5mm</button>
          <button data-v="2.6" class="on">迷你豆 · 2.6mm</button>
          <button data-v="1.2">微型豆 · 1.2mm</button>
        </div>
      </div>

      <div class="row">
        <label>宽度（颗数）<span class="val" id="wVal">60</span></label>
        <input type="range" id="width" min="8" max="200" value="60" step="1">
        <div class="range-labels"><span>8</span><span>200</span></div>
      </div>

      <div class="row">
        <label>高度（颗数）<span class="val" id="hVal">60</span></label>
        <input type="range" id="height" min="8" max="200" value="60" step="1">
        <div class="range-labels"><span>8</span><span>200</span></div>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="keepRatio" checked> 保持原图比例（改宽度自动调高度）</label>
      </div>

      <div class="row">
        <label>颜色数量 <span class="val" id="colorVal">不限</span></label>
        <input type="range" id="colorLimit" min="1" max="48" value="48" step="1">
        <div class="range-labels"><span>1</span><span>48</span></div>
      </div>

      <div class="row">
        <label>画板形状</label>
        <div class="seg" id="shape">
          <button data-v="rect" class="on">矩形</button>
          <button data-v="circle">圆形</button>
          <button data-v="hex">六边形</button>
        </div>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="removeBg"> 去除纯色背景（背景格不计入）</label>
      </div>

      <div class="row">
        <label>调色 · 亮度 <span class="val" id="briVal">0</span></label>
        <input type="range" id="brightness" min="-100" max="100" value="0" step="1">
      </div>
      <div class="row">
        <label>调色 · 对比度 <span class="val" id="conVal">0</span></label>
        <input type="range" id="contrast" min="-100" max="100" value="0" step="1">
      </div>
      <div class="row">
        <label>调色 · 饱和度 <span class="val" id="satVal">0</span></label>
        <input type="range" id="saturation" min="-100" max="100" value="0" step="1">
      </div>

      <button class="btn" id="generate">生成拼豆图纸</button>
    </div>
  </div>

  <!-- 右：预览 -->
  <div class="right">
    <div class="card">
      <div class="preview-head">
        <div class="dims">图纸尺寸 <b id="dimsText">—</b> · 约 <b id="sizeText">—</b></div>
        <div class="toolbar" id="toolbar" style="display:none">
          <button id="toggleCode" class="on">色号标注</button>
          <button id="toggleGrid" class="on">网格线</button>
          <button id="downloadPng">下载图纸+清单</button>
          <button id="downloadPngPlain">纯色块 PNG</button>
          <button id="downloadCsv">下载 CSV</button>
          <button id="printBtn">打印</button>
        </div>
      </div>
      <div class="stage">
        <div class="placeholder" id="placeholder">
          <div class="big">🧩</div>
          <p>上传图片后点击「生成拼豆图纸」<br>这里会显示带色号的拼豆格图</p>
        </div>
        <canvas id="canvas"></canvas>
      </div>
      <div id="statsWrap" style="margin-top:16px;display:none">
        <h2 style="font-size:15px;font-weight:800;margin-bottom:10px">色号对照统计（需用到的颜色与颗数）</h2>
        <div class="stats" id="stats"></div>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
/* ============ MARD 漫得 标准 221 色（A–H + M 九系列） ============ */
const MARD = [
["A1","#F9F0CD"],["A2","#FBFBD4"],["A3","#FAFC9F"],["A4","#FFE953"],["A5","#F4D738"],
["A6","#FDAD49"],["A7","#FF7C2F"],["A8","#EACA49"],["A9","#FF995A"],["A10","#FF9D55"],
["A11","#FFDD99"],["A12","#FCB58F"],["A13","#FFBB59"],["A14","#FF6D40"],["A15","#FDFF44"],
["A16","#FEF9AE"],["A17","#FFE36E"],["A18","#FECF98"],["A19","#FD7B72"],["A20","#EFCD67"],
["A21","#FFE395"],["A22","#FFF3A4"],["A23","#F3D5BF"],["A24","#FBF8C9"],["A25","#FFD67D"],
["A26","#FFBB27"],
["B1","#E6EE32"],["B2","#5BE419"],["B3","#7CEE9D"],["B4","#1EF942"],["B5","#00BD35"],
["B6","#5AE8BA"],["B7","#03AC88"],["B8","#029D26"],["B9","#26523A"],["B10","#95D3C2"],
["B11","#5D722A"],["B12","#156F40"],["B13","#D9F794"],["B14","#ADE945"],["B15","#2E5132"],
["B16","#C6ED9C"],["B17","#9BB13A"],["B18","#E6EE49"],["B19","#25B88C"],["B20","#C2F0CC"],
["B21","#146A6B"],["B22","#0B3C43"],["B23","#303921"],["B24","#EEFCA5"],["B25","#4E846D"],
["B26","#8C7A36"],["B27","#D1DCC1"],["B28","#9EE5B9"],["B29","#C5E254"],["B30","#ECFBD0"],
["B31","#C4E6B5"],["B32","#9BAB5A"],
["C1","#E8FFE7"],["C2","#BCF9F6"],["C3","#A0E2FB"],["C4","#42CCFF"],["C5","#01ACEB"],
["C6","#50A9F0"],["C7","#0188D3"],["C8","#1054C0"],["C9","#314BCA"],["C10","#3EBCE2"],
["C11","#03B9B9"],["C12","#1C334D"],["C13","#CDE8FF"],["C14","#D5FDFF"],["C15","#23C4C6"],
["C16","#1757A8"],["C17","#50D3EC"],["C18","#1C3344"],["C19","#1787A2"],["C20","#0082BE"],
["C21","#BEDDFF"],["C22","#67B4BE"],["C23","#C2DCEB"],["C24","#7DC4FF"],["C25","#A9E5E5"],
["C26","#2F99B3"],["C27","#EBF5FC"],["C28","#BBCFED"],["C29","#4B5BA3"],
["D1","#AEB4F2"],["D2","#858EDD"],["D3","#3054AF"],["D4","#182A84"],["D5","#B843C5"],
["D6","#AC7BDE"],["D7","#6E399A"],["D8","#E2D3FF"],["D9","#D5B9F8"],["D10","#361B50"],
["D11","#B9BAE1"],["D12","#DE9AD4"],["D13","#B90295"],["D14","#8B279B"],["D15","#2F1F90"],
["D16","#E2E1EE"],["D17","#C4D4F6"],["D18","#A45EC7"],["D19","#D8C3D7"],["D20","#9C32B2"],
["D21","#9A009B"],["D22","#333995"],["D23","#EADAFC"],["D24","#7786E5"],["D25","#484FC7"],
["D26","#E9C3F6"],
["E1","#FDD3CC"],["E2","#FECDDF"],["E3","#FF97C3"],["E4","#E8649E"],["E5","#F551A2"],
["E6","#FF346B"],["E7","#C63578"],["E8","#FFDBE9"],["E9","#E970CC"],["E10","#D33893"],
["E11","#FCDDD2"],["E12","#FFA1C5"],["E13","#B6006D"],["E14","#FFD1BA"],["E15","#F2CFD0"],
["E16","#FFECDE"],["E17","#FFE2EA"],["E18","#FFC9D6"],["E19","#FFD2E7"],["E20","#D8C7D1"],
["E21","#BD9DA1"],["E22","#CC78A7"],["E23","#937A8D"],["E24","#F6E4F9"],
["F1","#FD957B"],["F2","#FC3D45"],["F3","#F74941"],["F4","#FC283C"],["F5","#D80127"],
["F6","#B0443D"],["F7","#971937"],["F8","#BC0127"],["F9","#E2677A"],["F10","#A74D22"],
["F11","#6F201F"],["F12","#FD4D6A"],["F13","#DD422F"],["F14","#FFA9AD"],["F15","#C80020"],
["F16","#FFD9C8"],["F17","#F79B71"],["F18","#D37C46"],["F19","#C1444A"],["F20","#CD9391"],
["F21","#F4B1B4"],["F22","#FFD0CB"],["F23","#F57E66"],["F24","#FCC1C4"],["F25","#E54B4F"],
["G1","#FFE2CE"],["G2","#FFCAAA"],["G3","#F4C3A5"],["G4","#E1B383"],["G5","#ED9435"],
["G6","#F59734"],["G7","#9D5B3E"],["G8","#592A21"],["G9","#E6B483"],["G10","#C88135"],
["G11","#E0C593"],["G12","#EBBB83"],["G13","#B7714A"],["G14","#8D614C"],["G15","#FCF9E0"],
["G16","#F2D9BA"],["G17","#56403C"],["G18","#FFE4CC"],["G19","#E1943A"],["G20","#A94023"],
["G21","#CB8E77"],
["H1","#E2E2E2"],["H2","#FFFFFF"],["H3","#B3B3B3"],["H4","#868686"],["H5","#474747"],
["H6","#2C2C2C"],["H7","#000000"],["H8","#E7D6DB"],["H9","#E4E7E3"],["H10","#EEE9EA"],
["H11","#CECDD5"],["H12","#FFF5ED"],["H13","#F3E1C9"],["H14","#CFD7D3"],["H15","#98A6A8"],
["H16","#3B2F23"],["H17","#F1EDED"],["H18","#FFFDF0"],["H19","#F6EFE2"],["H20","#949FA3"],
["H21","#F7F3E4"],["H22","#CACAD5"],["H23","#9A9D94"],
["M1","#BCC6B8"],["M2","#8AA385"],["M3","#697D80"],["M4","#DACEBE"],["M5","#D0CCAA"],
["M6","#B0A782"],["M7","#B4A497"],["M8","#B38281"],["M9","#A58767"],["M10","#C5B1BC"],
["M11","#9F7494"],["M12","#644749"],["M13","#D19066"],["M14","#C77361"],["M15","#757D7B"]
];
/* 预解析为 RGB 与缓存距离用 */
const RGB = MARD.map(([code,hex])=>{
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return {code,hex,r,g,b};
});

/* ============ 颜色距离（redmean 加权，贴近人眼感知） ============ */
function dist(r1,g1,b1,r2,g2,b2){
  const rm=(r1+r2)/2;
  const dr=r1-r2, dg=g1-g2, db=b1-b2;
  return Math.sqrt((2+rm/256)*dr*dr + 4*dg*dg + (2+(255-rm)/256)*db*db);
}
function matchColor(r,g,b){
  let best=0, bd=Infinity;
  for(let i=0;i<RGB.length;i++){
    const c=RGB[i], d=dist(r,g,b,c.r,c.g,c.b);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

/* ============ 状态 ============ */
let img=null, imgW=0, imgH=0, grid=null, gridW=0, gridH=0;
let showCode=true, showGrid=true;

const $=id=>document.getElementById(id);
const drop=$('drop'), file=$('file'), thumb=$('thumb'), thumbImg=$('thumbImg'), thumbMeta=$('thumbMeta');
const canvas=$('canvas'), ctx=canvas.getContext('2d');

/* 颜色数量限制：超出时把低频色号并入最近的保留色号 */
function applyColorLimit(grid, w, h, limit){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  if(freq.size<=limit) return grid;
  // 按频次排序，保留前 limit 个高频色
  const order=[...freq.entries()].sort((a,b)=>b[1]-a[1]);
  const keep=new Set(order.slice(0,limit).map(e=>e[0]));
  const map=new Array(grid.length);
  for(let i=0;i<grid.length;i++){
    const g=grid[i];
    if(g<0 || keep.has(g)){ map[i]=g; continue; }
    // 并入最近的保留色号
    const c=RGB[g]; let b=-1,bd=Infinity;
    keep.forEach(k=>{ const kk=RGB[k], d=dist(c.r,c.g,c.b,kk.r,kk.g,kk.b); if(d<bd){bd=d;b=k;} });
    map[i]=b;
  }
  return map;
}

/* 画板形状判断（返回该格是否保留） */
function shapeKeep(x,y,w,h,shape){
  if(shape==='rect') return true;
  const cx=(w-1)/2, cy=(h-1)/2;
  if(shape==='circle'){
    const rx=w/2, ry=h/2;
    const nx=(x-cx)/rx, ny=(y-cy)/ry;
    return nx*nx+ny*ny<=1;
  }
  if(shape==='hex'){
    // 六边形：以中心为原点，横向扁平，用轴向距离近似
    const nx=Math.abs(x-cx)/(w/2), ny=Math.abs(y-cy)/(h/2);
    // 正六边形：|x|/a + |y|/b <= 1 且顶点收敛 → 用 max(|nx|,|ny|) 与内切判断
    return (Math.abs(nx)+0.5*Math.abs(ny))<=1 && (0.5*Math.abs(nx)+Math.abs(ny))<=1;
  }
  return true;
}

function hex2rgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }

/* 调色：亮度/对比度/饱和度 */
function adjust(r,g,b,bri,con,sat){
  // 亮度
  if(bri){ const o=bri*1.28; r+=o; g+=o; b+=o; }
  // 对比度
  if(con){ const f=(259*(con+255))/(255*(259-con)); r=f*(r-128)+128; g=f*(g-128)+128; b=f*(b-128)+128; }
  // 饱和度
  if(sat){
    const s=sat/100;
    const gray=0.299*r+0.587*g+0.114*b;
    r=gray+(r-gray)*(1+s); g=gray+(g-gray)*(1+s); b=gray+(b-gray)*(1+s);
  }
  return [Math.max(0,Math.min(255,r)),Math.max(0,Math.min(255,g)),Math.max(0,Math.min(255,b))];
}

function generate(){
  if(!img) return;
  const w=+$('width').value, h=+$('height').value;
  const keep=$('keepRatio').checked;
  const limit=+$('colorLimit').value;
  const shape=$('shape').querySelector('.on').dataset.v;
  const removeBg=$('removeBg').checked;
  const bri=+$('brightness').value, con=+$('contrast').value, sat=+$('saturation').value;

  // 采样：把原图缩到 w×h
  const off=document.createElement('canvas'); off.width=w; off.height=h;
  const octx=off.getContext('2d');
  octx.imageSmoothingEnabled=true; octx.imageSmoothingQuality='high';
  octx.drawImage(img,0,0,imgW,imgH,0,0,w,h);
  const data=octx.getImageData(0,0,w,h).data;

  gridW=w; gridH=h;
  grid=new Array(w*h);
  for(let i=0;i<w*h;i++){
    const p=i*4;
    const a=data[p+3];
    if(a<40){ grid[i]=-1; continue; } // 透明/空白
    let [r,g,b]=adjust(data[p],data[p+1],data[p+2],bri,con,sat);
    grid[i]=matchColor(r,g,b);
  }

  // 去背景：以四角平均色为背景，接近者置空
  if(removeBg){
    const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
    let sr=0,sg=0,sb=0,n=0;
    corners.forEach(([cx,cy])=>{ const ci=cy*w+cx; if(grid[ci]>=0){ const c=RGB[grid[ci]]; sr+=c.r;sg+=c.g;sb+=c.b;n++; } });
    if(n){ sr/=n;sg/=n;sb/=n;
      for(let i=0;i<w*h;i++){ if(grid[i]<0) continue; const c=RGB[grid[i]]; if(dist(c.r,c.g,c.b,sr,sg,sb)<26) grid[i]=-1; }
    }
  }

  // 颜色数量限制
  if(limit<48) grid=applyColorLimit(grid,w,h,limit);

  // 形状裁切（置空形状外格）
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!shapeKeep(x,y,w,h,shape)) grid[y*w+x]=-1; }

  draw();
  buildStats();
  updateDims(w,h);
  $('toolbar').style.display='flex';
  $('placeholder').style.display='none';
}

/* ============ 绘制 ============ */
function draw(){
  const w=gridW, h=gridH; if(!w) return;
  const cell=36; // 每格像素
  const pad=28; // 边距（放坐标刻度）
  const cw=pad*2+w*cell, ch=pad*2+h*cell;
  canvas.width=cw; canvas.height=ch;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch);

  // 格子
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const g=grid[y*w+x];
    const px=pad+x*cell, py=pad+y*cell;
    if(g<0){ ctx.fillStyle='#f4f5f7'; ctx.fillRect(px,py,cell,cell); }
    else { ctx.fillStyle=RGB[g].hex; ctx.fillRect(px,py,cell,cell); }
  }
  // 网格线
  if(showGrid){
    ctx.strokeStyle='rgba(120,128,140,.28)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=w;x++){ const px=pad+x*cell; ctx.moveTo(px,pad); ctx.lineTo(px,pad+h*cell); }
    for(let y=0;y<=h;y++){ const py=pad+y*cell; ctx.moveTo(pad,py); ctx.lineTo(pad+w*cell,py); }
    ctx.stroke();
  }
  // 色号标注
  if(showCode){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const fs=cell>28?11:9; ctx.font=`700 ${fs}px "Microsoft YaHei",sans-serif`;
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const g=grid[y*w+x]; if(g<0) continue;
      const c=RGB[g];
      const lum=0.299*c.r+0.587*c.g+0.114*c.b;
      ctx.fillStyle=lum>150?'rgba(30,35,45,.82)':'rgba(255,255,255,.92)';
      ctx.fillText(c.code, pad+x*cell+cell/2, pad+y*cell+cell/2);
    }
  }
  // 坐标刻度
  ctx.fillStyle='#9aa2b1'; ctx.font='10px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let x=0;x<w;x++){ if(x%5===0) ctx.fillText(String(x+1), pad+x*cell+cell/2, pad-12); }
  for(let y=0;y<h;y++){ if(y%5===0) ctx.fillText(String(y+1), pad-14, pad+y*cell+cell/2); }
}

/* ============ 统计 ============ */
function buildStats(){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  const total=[...freq.values()].reduce((a,b)=>a+b,0)||1;
  const arr=[...freq.entries()].sort((a,b)=>RGB[a[0]].code.localeCompare(RGB[b[0]].code));
  const box=$('stats'); box.innerHTML='';
  if(arr.length===0){ box.innerHTML='<div class="stat-empty">无有效色号</div>'; return; }
  $('statsWrap').style.display='block';
  arr.forEach(([g,n])=>{
    const c=RGB[g];
    const el=document.createElement('div'); el.className='stat';
    el.innerHTML=`<div class="swatch" style="background:${c.hex}"></div><span class="code">${c.code}</span><span class="n">${n}颗</span>`;
    el.title=c.hex;
    box.appendChild(el);
  });
}

function updateDims(w,h){
  const size=+($('beadSize').querySelector('.on').dataset.v);
  $('dimsText').textContent=`${w} × ${h} 格`;
  $('sizeText').textContent=`${(w*size/10).toFixed(1)} × ${(h*size/10).toFixed(1)} cm`;
}

/* ============ 导出 ============ */
/* 绘制图纸到一个 canvas（withCode=是否带色号标注），返回 canvas */
function renderBoard(cell, pad, withCode){
  const w=gridW, h=gridH;
  const cw=pad*2+w*cell, ch=pad*2+h*cell;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
  for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){
    const g=grid[y*w+xx]; const px=pad+xx*cell, py=pad+y*cell;
    x.fillStyle=g<0?'#f4f5f7':RGB[g].hex; x.fillRect(px,py,cell,cell);
  }
  if(withCode){
    x.strokeStyle='rgba(120,128,140,.25)'; x.lineWidth=1;
    x.beginPath();
    for(let xx=0;xx<=w;xx++){const px=pad+xx*cell;x.moveTo(px,pad);x.lineTo(px,pad+h*cell);}
    for(let y=0;y<=h;y++){const py=pad+y*cell;x.moveTo(pad,py);x.lineTo(pad+w*cell,py);}
    x.stroke();
    x.textAlign='center'; x.textBaseline='middle'; x.font='700 10px "Microsoft YaHei",sans-serif';
    for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){
      const g=grid[y*w+xx]; if(g<0) continue;
      const cc=RGB[g], lum=0.299*cc.r+0.587*cc.g+0.114*cc.b;
      x.fillStyle=lum>150?'rgba(30,35,45,.82)':'rgba(255,255,255,.92)';
      x.fillText(cc.code, pad+xx*cell+cell/2, pad+y*cell+cell/2);
    }
    // 坐标刻度
    x.fillStyle='#9aa2b1'; x.font='10px "Microsoft YaHei",sans-serif';
    for(let xx=0;xx<w;xx++){ if(xx%5===0) x.fillText(String(xx+1), pad+xx*cell+cell/2, pad-12); }
    for(let y=0;y<h;y++){ if(y%5===0) x.fillText(String(y+1), pad-14, pad+y*cell+cell/2); }
  }
  return c;
}

/* 统计条目（按色号排序） */
function statsEntries(){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  return [...freq.entries()].sort((a,b)=>RGB[a[0]].code.localeCompare(RGB[b[0]].code));
}

/* 完整导出：标题 + 拼豆格图 + 色号对照统计清单 合成一张 */
function exportPng(){
  const w=gridW,h=gridH; if(!w) return;
  const size=+($('beadSize').querySelector('.on').dataset.v);
  const cell=30, pad=26;
  const board=renderBoard(cell,pad,true);
  const entries=statsEntries();

  const perRow=6, itemW=150, itemH=40, gap=10;
  const rows=Math.max(1,Math.ceil(entries.length/perRow));
  const statsW=perRow*itemW+(perRow-1)*gap;
  const margin=30;
  const titleH=86, statsTitleH=52;
  const cw=Math.max(board.width, statsW)+margin*2;
  const ch=titleH+board.height+statsTitleH+rows*(itemH+gap)+margin*2;

  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);

  // 标题
  x.fillStyle='#1c2128'; x.textAlign='center'; x.textBaseline='alphabetic';
  x.font='800 26px "Microsoft YaHei",sans-serif';
  x.fillText('拼豆色号图纸', cw/2, 42);
  x.fillStyle='#7c8595'; x.font='14px "Microsoft YaHei",sans-serif';
  x.fillText(`${w} × ${h} 格 · 迷你豆 ${size}mm · 成品约 ${(w*size/10).toFixed(1)} × ${(h*size/10).toFixed(1)} cm`, cw/2, 68);

  // 图纸
  const bx=(cw-board.width)/2, by=titleH+14;
  x.drawImage(board, bx, by);

  // 统计标题
  const sy=by+board.height+22;
  x.fillStyle='#1c2128'; x.textAlign='left';
  x.font='800 18px "Microsoft YaHei",sans-serif';
  x.fillText(`色号对照统计（共 ${entries.length} 色）`, margin, sy+16);

  // 统计条目
  const sx=(cw-statsW)/2, sy2=sy+44;
  entries.forEach(([g,n],i)=>{
    const col=i%perRow, row=Math.floor(i/perRow);
    const ix=sx+col*(itemW+gap), iy=sy2+row*(itemH+gap);
    const cc=RGB[g];
    x.fillStyle='#f8f9fb';
    x.strokeStyle='#e6e8ee'; x.lineWidth=1;
    x.fillRect(ix,iy,itemW,itemH);
    x.strokeRect(ix,iy,itemW,itemH);
    x.fillStyle=cc.hex;
    x.fillRect(ix+8, iy+8, 24, 24);
    x.strokeStyle='rgba(0,0,0,.1)'; x.strokeRect(ix+8,iy+8,24,24);
    x.fillStyle='#1c2128'; x.textAlign='left';
    x.font='700 14px "Microsoft YaHei",sans-serif';
    x.fillText(cc.code, ix+40, iy+19);
    x.fillStyle='#7c8595'; x.font='12px "Microsoft YaHei",sans-serif';
    x.fillText(n+'颗', ix+40, iy+35);
  });

  const a=document.createElement('a');
  a.download=`拼豆色号图_${w}x${h}.png`;
  a.href=c.toDataURL('image/png');
  a.click();
}

/* 纯色块图纸导出（仅格图，无标注无清单） */
function exportPngPlain(){
  const w=gridW,h=gridH; if(!w) return;
  const board=renderBoard(30,8,false);
  const a=document.createElement('a');
  a.download=`拼豆色号图_${w}x${h}_纯色块.png`;
  a.href=board.toDataURL('image/png');
  a.click();
}

function exportCsv(){
  const w=gridW,h=gridH; if(!w) return;
  let lines=[];
  for(let y=0;y<h;y++){
    const row=[];
    for(let x=0;x<w;x++){ const g=grid[y*w+x]; row.push(g<0?'':RGB[g].code); }
    lines.push(row.join(','));
  }
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.download=`拼豆色号矩阵_${w}x${h}.csv`;
  a.href=URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ============ 事件 ============ */
drop.addEventListener('click',()=>file.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)loadFile(f);});
file.addEventListener('change',()=>{if(file.files[0])loadFile(file.files[0]);});

function loadFile(f){
  if(!/^image\//.test(f.type)){ alert('请选择图片文件'); return; }
  const url=URL.createObjectURL(f);
  const im=new Image();
  im.onload=()=>{
    img=im; imgW=im.naturalWidth; imgH=im.naturalHeight;
    thumbImg.src=url; thumbMeta.textContent=`${imgW} × ${imgH} px`;
    thumb.style.display='block';
    $('settingsCard').style.display='block';
    // 默认按比例 60 宽
    $('width').value=60;
    $('height').value=Math.max(8,Math.min(200,Math.round(60*imgH/imgW)));
    $('wVal').textContent=$('width').value;
    $('hVal').textContent=$('height').value;
    updateDims(+$('width').value,+$('height').value);
    generate();
  };
  im.src=url;
}

/* 规格 */
$('beadSize').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  $('beadSize').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  updateDims(gridW||+$('width').value, gridH||+$('height').value);
});
/* 形状 */
$('shape').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  $('shape').querySelectorAll('button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
  generate();
});
/* 滑块联动 */
function bindRange(id, valId, fmt, cb){
  $(id).addEventListener('input',()=>{ $(valId).textContent=fmt(+$(id).value); });
  if(cb) $(id).addEventListener('change',cb);
}
bindRange('width','wVal',v=>v,()=>{
  if($('keepRatio').checked && img){ $('height').value=Math.max(8,Math.min(200,Math.round((+$('width').value)*imgH/imgW))); $('hVal').textContent=$('height').value; }
  generate();
});
bindRange('height','hVal',v=>v,()=>generate());
bindRange('colorLimit','colorVal',v=>v>=48?'不限':v,()=>generate());
bindRange('brightness','briVal',v=>v,()=>generate());
bindRange('contrast','conVal',v=>v,()=>generate());
bindRange('saturation','satVal',v=>v,()=>generate());
$('keepRatio').addEventListener('change',()=>{ if($('keepRatio').checked && img){ $('height').value=Math.max(8,Math.min(200,Math.round((+$('width').value)*imgH/imgW))); $('hVal').textContent=$('height').value; } });
$('removeBg').addEventListener('change',()=>generate());
$('generate').addEventListener('click',()=>generate());

/* 工具栏 */
$('toggleCode').addEventListener('click',function(){ showCode=!showCode; this.classList.toggle('on',showCode); draw(); });
$('toggleGrid').addEventListener('click',function(){ showGrid=!showGrid; this.classList.toggle('on',showGrid); draw(); });
$('downloadPng').addEventListener('click',()=>exportPng());
$('downloadPngPlain').addEventListener('click',()=>exportPngPlain());
$('downloadCsv').addEventListener('click',()=>exportCsv());
$('printBtn').addEventListener('click',()=>window.print());
</script>
