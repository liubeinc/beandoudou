<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>拼豆色号图生成器 · MARD / Artkal / Hama / Perler</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --line:#e6e8ee; --text:#1c2128; --mut:#7c8595;
    --pri:#5b6cf0; --pri-2:#7c8cf5; --pri-soft:#eef0fe; --ok:#22a06b;
    --shadow:0 4px 20px rgba(28,40,58,.07); --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:linear-gradient(180deg,#eef1fb 0%,var(--bg) 320px);font-family:"Microsoft YaHei",-apple-system,"Segoe UI",sans-serif;color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
  header{background:linear-gradient(120deg,#4f5fe0,#7c5bf0);color:#fff;padding:20px 28px;box-shadow:0 2px 14px rgba(79,95,224,.25)}
  header h1{font-size:21px;font-weight:800;letter-spacing:.5px}
  header p{font-size:13px;opacity:.86;margin-top:4px}
  .wrap{max-width:1280px;margin:0 auto;padding:22px 20px 60px;display:grid;grid-template-columns:360px 1fr;gap:22px;align-items:start}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
  .card + .card{margin-top:16px}
  .card h2{font-size:16px;font-weight:800;margin-bottom:16px;display:flex;align-items:center;gap:8px}
  .card h2 .step{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--pri);color:#fff;font-size:12px;font-weight:800;align-items:center;justify-content:center}
  .card h2 .hint{font-size:13px;font-weight:400;color:var(--mut)}
  /* 上传 */
  .drop{border:2px dashed #cdd2e2;border-radius:12px;padding:26px 16px;text-align:center;cursor:pointer;transition:.15s;background:#fafbfe}
  .drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-soft)}
  .drop .big{font-size:30px;line-height:1}
  .drop .t{font-size:14px;font-weight:700;margin-top:8px}
  .drop .s{font-size:13px;color:var(--mut);margin-top:4px}
  .drop input{display:none}
  .preview-thumb{display:none;margin-top:12px;text-align:center}
  .preview-thumb img{max-width:100%;max-height:200px;border-radius:8px;border:1px solid var(--line)}
  .preview-thumb .meta{font-size:12px;color:var(--mut);margin-top:6px}
  /* 裁切 */
  .crop-wrap{position:relative;display:inline-block;line-height:0;max-width:100%;user-select:none}
  .crop-wrap img{display:block}
  .crop-box{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.4);cursor:move;touch-action:none;background:rgba(91,108,240,.08)}
  .crop-handle{position:absolute;width:12px;height:12px;background:#fff;border:1.5px solid var(--pri);border-radius:50%;z-index:2}
  .crop-handle.nw{left:-6px;top:-6px;cursor:nwse-resize}
  .crop-handle.n{left:50%;top:-6px;transform:translateX(-50%);cursor:ns-resize}
  .crop-handle.ne{right:-6px;top:-6px;cursor:nesw-resize}
  .crop-handle.e{right:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  .crop-handle.se{right:-6px;bottom:-6px;cursor:nwse-resize}
  .crop-handle.s{left:50%;bottom:-6px;transform:translateX(-50%);cursor:ns-resize}
  .crop-handle.sw{left:-6px;bottom:-6px;cursor:nesw-resize}
  .crop-handle.w{left:-6px;top:50%;transform:translateY(-50%);cursor:ew-resize}
  .crop-actions{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .crop-actions button{padding:5px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#4a5361;transition:.12s}
  .crop-actions button:hover{border-color:var(--pri);color:var(--pri)}
  .crop-actions button.primary{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  select.mard-mode{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#4a5361}
  /* 表单控件 */
  .row{margin-bottom:16px}
  .row label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
  .row label .val{color:var(--pri);font-weight:800}
  .row-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
  .row-head label{margin-bottom:0}
  .row-head .btn.ghost{margin:0;flex:0 0 auto;padding:6px 12px}
  .row-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto;position:relative}
  .btn.ghost.reset{color:var(--mut);border-color:transparent;background:transparent;padding:6px 2px;font-weight:500;font-size:12px}
  .btn.ghost.reset:hover{color:var(--pri);border-color:transparent;background:transparent;text-decoration:underline}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  #brand{display:flex;gap:8px;flex-wrap:nowrap;position:relative}
  #brand button{flex:1;padding:9px 4px}
  .caret{font-size:12px;margin-left:6px;opacity:.7;vertical-align:-1px}
  .submenu{position:absolute;top:calc(100% + 6px);left:0;min-width:236px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(28,40,58,.16);padding:5px;z-index:30;text-align:left}
  #brand .submenu button{flex:none;width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border:none;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:#4a5361;white-space:normal;text-align:left;cursor:pointer;transition:.12s;box-shadow:none;letter-spacing:0}
  #brand .submenu button:hover{background:var(--pri-soft);color:var(--pri)}
  #brand .submenu button.on{color:var(--pri);background:var(--pri-soft)}
  #brand .submenu button .tick{margin-left:auto;color:var(--pri);font-weight:800}
  #brand .submenu button:not(.on) .tick{visibility:hidden}
  .row-actions .submenu{left:auto;right:0;top:calc(100% + 4px);min-width:132px}
  .row-actions .submenu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border:none;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:#4a5361;white-space:normal;text-align:left;cursor:pointer;transition:.12s}
  .row-actions .submenu button:hover{background:var(--pri-soft);color:var(--pri)}
  .split-group{position:relative;display:inline-flex;align-items:center}
  .split-btn{position:relative;display:inline-flex;align-items:stretch}
  .split-btn .btn.ghost{margin:0;border-radius:9px 0 0 9px;border-right:0}
  .split-btn .btn.ghost.split-caret{border-radius:0 9px 9px 0;border-left:0;padding:6px 14px;min-width:40px}
  .split-btn .btn.ghost.split-caret .caret{margin-left:0}
  .tsep{width:1px;align-self:stretch;background:var(--line);margin:3px 2px}
  .toolbar .submenu{left:0;top:calc(100% + 6px);min-width:172px}
  .toolbar .submenu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border:none;border-radius:7px;background:transparent;font-size:13px;font-weight:600;color:#4a5361;white-space:nowrap;text-align:left;cursor:pointer;transition:.12s;box-shadow:none}
  .toolbar .submenu button:hover{background:var(--pri-soft);color:var(--pri)}
  .toolbar .submenu button.on{background:var(--pri-soft);color:var(--pri)}
  .toolbar .submenu button .tick{margin-left:auto;color:var(--pri);font-weight:800}
  .toolbar .submenu button:not(.on) .tick{visibility:hidden}
  .seg button{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#4a5361;transition:.12s;white-space:nowrap}
  .seg button:hover{border-color:var(--pri-2)}
  .seg button:active{background:#eef0fe}
  .seg button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri);box-shadow:0 0 0 3px rgba(91,108,240,.12)}
  input[type=range]{width:100%;height:26px;-webkit-appearance:none;appearance:none;background:transparent;cursor:pointer;touch-action:none}
  html,body{overscroll-behavior-x:none;touch-action:manipulation}
  input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#d7dcee,#e3e6f2)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-5px;border-radius:50%;background:#fff;border:2px solid var(--pri);box-shadow:0 1px 4px rgba(28,40,58,.2);transition:.12s}
  input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1)}
  input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#d7dcee}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--pri);box-shadow:0 1px 4px rgba(28,40,58,.2)}
  .range-labels{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:2px}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer}
  .check input{accent-color:var(--pri);width:16px;height:16px;cursor:pointer}
  .bg-pick{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .bg-pick-btn{padding:5px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:12px;font-weight:700;color:#4a5361;transition:.12s}
  .bg-pick-btn:hover{border-color:var(--pri);color:var(--pri)}
  .bg-pick-btn.active{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  .bg-swatches{display:inline-flex;align-items:center;gap:5px;flex-wrap:wrap}
  .bg-swatch{width:18px;height:18px;border-radius:5px;border:1px solid var(--line);box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);flex:0 0 auto}
  .bg-clear{padding:3px 9px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:11px;font-weight:600;color:var(--mut);transition:.12s}
  .bg-clear:hover{border-color:#e5484d;color:#e5484d}
  .bg-hint{font-size:12px;color:var(--mut)}
  #thumbImg.picking{cursor:crosshair;outline:2px solid var(--pri);outline-offset:-2px}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:11px;background:linear-gradient(120deg,#5b6cf0,#7c5bf0);color:#fff;font-size:15px;font-weight:800;cursor:pointer;transition:.15s;letter-spacing:1px;box-shadow:0 4px 14px rgba(91,108,240,.28)}
  .btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
  .btn:active{transform:translateY(0);filter:brightness(.97)}
  .btn:disabled{background:#c9cede;cursor:not-allowed;box-shadow:none}
  .btn.ghost{margin:10px 0 14px;display:inline-flex;width:auto;align-items:center;justify-content:center;padding:8px 14px;font-size:13px;font-weight:600;background:#fff;color:var(--pri);border:1px solid var(--line);border-radius:9px;box-shadow:none;letter-spacing:0}
  .btn.ghost:hover{border-color:var(--pri)}
  .btn.ghost.pending{border-color:var(--pri);background:var(--pri-soft);animation:applyPulse 1.4s ease-in-out infinite}
  @keyframes applyPulse{0%,100%{box-shadow:0 0 0 0 rgba(91,108,240,.35)}50%{box-shadow:0 0 0 6px rgba(91,108,240,0)}}
  /* 手机端底部固定操作条 + 缩放角标 */
  .mobile-genbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(28,40,58,.08);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));gap:12px;align-items:center}
  .mobile-genbar .gmeta{flex:1;min-width:0;font-size:12px;color:var(--mut);line-height:1.4}
  .mobile-genbar .gmeta b{color:var(--text);font-weight:800}
  .mobile-genbar .gbtn{flex:0 0 auto;padding:12px 24px;border:none;border-radius:11px;background:linear-gradient(120deg,#5b6cf0,#7c5bf0);color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(91,108,240,.28)}
  .mobile-genbar .gbtn:active{filter:brightness(.97)}
  .zoom-badge{position:absolute;top:10px;right:12px;z-index:5;padding:3px 9px;border-radius:999px;background:rgba(28,40,58,.72);color:#fff;font-size:12px;font-weight:700;display:none;pointer-events:none}
  /* 右侧预览 */
  .right{min-width:0}
  .preview-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .preview-head .dims{font-size:14px;font-weight:700;color:var(--mut)}
  .preview-head .dims b{color:var(--text);font-size:17px}
  .bead-total{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:4px 12px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-size:14px;font-weight:800}
  .bead-total b{color:var(--pri);font-size:18px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap}
  .toolbar button{padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#4a5361;transition:.12s}
  .toolbar button:hover{border-color:var(--pri);color:var(--pri)}
  .toolbar button.on{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
  .stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow:auto;text-align:center}
  .stage canvas{max-width:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:4px}
  .placeholder{color:var(--mut);padding:60px 20px;text-align:center}
  .placeholder .big{font-size:44px}
  .placeholder p{font-size:14px;margin-top:10px}
  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:14px}
  .stat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff}
  .swatch{width:28px;height:28px;border-radius:7px;border:1px solid rgba(0,0,0,.1);flex:0 0 auto}
  .stat .code{font-size:13px;font-weight:800}
  .stat .n{font-size:12px;color:var(--mut);margin-left:auto}
  .stat .pct{font-size:12px;color:var(--mut)}
  .stat-empty{color:var(--mut);font-size:13px}
  /* 触控目标放大：手指友好（≥44px 点击区） */
  @media (hover:none),(pointer:coarse){
    .seg button{padding:12px 10px}
    .btn{padding:15px}
    .split-btn .btn.ghost.split-caret{min-width:48px;padding:6px 16px}
    .check{min-height:44px}
    .check input{width:20px;height:20px}
    .crop-handle{width:22px;height:22px;border-width:2px}
    .crop-handle.nw{left:-11px;top:-11px}
    .crop-handle.n{left:50%;top:-11px}
    .crop-handle.ne{right:-11px;top:-11px}
    .crop-handle.e{right:-11px;top:50%}
    .crop-handle.se{right:-11px;bottom:-11px}
    .crop-handle.s{left:50%;bottom:-11px}
    .crop-handle.sw{left:-11px;bottom:-11px}
    .crop-handle.w{left:-11px;top:50%}
    input[type=range]{height:32px}
    input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px}
    input[type=range]::-webkit-slider-thumb{width:24px;height:24px;margin-top:-8px}
    input[type=range]::-moz-range-track{height:8px}
    input[type=range]::-moz-range-thumb{width:24px;height:24px}
    .stage{overflow:hidden}
    .stage canvas{touch-action:none;transform-origin:0 0;will-change:transform}
    .mobile-genbar.show{display:flex}
    body{padding-bottom:76px}
  }
  @media (max-width:900px){.wrap{grid-template-columns:1fr}}
  @media (max-width:640px){
    .wrap{padding:12px 12px 48px;gap:14px}
    .card{padding:14px;border-radius:14px}
    .card h2{font-size:14px;margin-bottom:12px}
    .stats{grid-template-columns:repeat(2,1fr);gap:6px;margin-top:10px}
    .stat{padding:6px 8px}
    .swatch{width:22px;height:22px}
    .stat .code{font-size:12px}
    .seg{gap:6px}
    input[type=range]::-webkit-slider-thumb{width:20px;height:20px;margin-top:-7px}
    input[type=range]::-moz-range-thumb{width:20px;height:20px}
    .btn{padding:15px;font-size:16px}
  }
  @media print{
    header,.left,.mobile-genbar{display:none!important}
    .wrap{display:block;padding:0}
    .card,.stage{border:none;box-shadow:none;padding:0}
    .toolbar{display:none!important}
    .right{display:block}
  }
</style>
</head>
<body>
<header>
  <h1>拼豆色号图生成器</h1>
  <p>上传任意图片 → 自动匹配 MARD / Artkal / Hama / Perler 真实色号 → 生成带色号的拼豆图纸</p>
</header>

<div class="wrap">
  <!-- 左：控制面板 -->
  <div class="left">
    <div class="card">
      <h2><span class="step">1</span> 选择色卡 <span class="hint">不同品牌对应不同真实色号</span></h2>
      <div class="seg" id="brand">
        <button data-v="mard" class="on" title="MARD 漫得">MARD<span class="caret">▾</span></button>
        <button data-v="artkal" title="Artkal 阿卡 · 159 色">Artkal</button>
        <button data-v="hama" title="Hama 哈马 · 91 色">Hama</button>
        <button data-v="perler" title="Perler 珀勒 · 101 色">Perler</button>
        <div class="submenu" id="mardMenu" hidden>
          <button data-m="291" class="on">291 色（含扩展 P/Q/R/T/Y/ZG）<span class="tick">✓</span></button>
          <button data-m="221">221 色（标准 A–M）<span class="tick">✓</span></button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2><span class="step">2</span> 选择原图 <span class="hint">JPG / PNG / WebP / GIF</span></h2>
      <div class="drop" id="drop">
        <div class="big">🖼️</div>
        <div class="t">拖入一张图片</div>
        <div class="s">或点击从电脑选择</div>
        <input type="file" id="file" accept="image/*">
      </div>
      <div class="preview-thumb" id="thumb">
        <div class="crop-wrap" id="cropWrap">
          <img id="thumbImg" alt="原图预览">
          <div class="crop-box" id="cropBox" style="display:none">
            <span class="crop-handle nw" data-h="nw"></span>
            <span class="crop-handle n" data-h="n"></span>
            <span class="crop-handle ne" data-h="ne"></span>
            <span class="crop-handle e" data-h="e"></span>
            <span class="crop-handle se" data-h="se"></span>
            <span class="crop-handle s" data-h="s"></span>
            <span class="crop-handle sw" data-h="sw"></span>
            <span class="crop-handle w" data-h="w"></span>
          </div>
        </div>
        <div class="meta" id="thumbMeta"></div>
        <div class="crop-actions" id="cropActions" style="display:none">
          <button type="button" id="cropToggle">裁切图片</button>
          <button type="button" id="cropApply" class="primary" style="display:none">应用裁切</button>
          <button type="button" id="cropReset" style="display:none">取消</button>
        </div>
      </div>
    </div>

    <div class="card" id="settingsCard" style="display:none">
      <h2><span class="step">3</span> 设置图纸</h2>

      <div class="row">
        <label>拼豆规格</label>
        <div class="seg" id="beadSize">
          <button data-v="5">标准豆 · 5mm</button>
          <button data-v="2.6" class="on">迷你豆 · 2.6mm</button>
          <button data-v="1.2">微型豆 · 1.2mm</button>
        </div>
      </div>

      <div class="row">
        <label>宽度（颗数）<span class="val" id="wVal">60</span></label>
        <input type="range" id="width" min="8" max="200" value="60" step="1">
        <div class="range-labels"><span>8</span><span>200</span></div>
      </div>

      <div class="row">
        <div class="row-head">
          <label>高度（颗数）<span class="val" id="hVal">60</span></label>
          <div class="row-actions">
            <div class="split-btn">
              <button class="btn ghost" id="applySize"><span class="lbl">应用更改</span></button>
              <button class="btn ghost split-caret" aria-label="恢复默认" title="恢复默认"><span class="caret">▾</span></button>
              <div class="submenu" id="sizeMenu" hidden>
                <button data-reset="size">恢复默认</button>
              </div>
            </div>
          </div>
        </div>
        <input type="range" id="height" min="8" max="200" value="60" step="1">
        <div class="range-labels"><span>8</span><span>200</span></div>
      </div>

      <div class="row">
        <label class="check"><input type="checkbox" id="keepRatio" checked> 保持原图比例（宽高联动）</label>
      </div>

      <div class="row">
        <div class="row-head">
          <label>颜色数量 <span class="val" id="colorVal">不限</span></label>
          <div class="row-actions">
            <div class="split-btn">
              <button class="btn ghost" id="applyColor"><span class="lbl">应用更改</span></button>
              <button class="btn ghost split-caret" aria-label="恢复默认" title="恢复默认"><span class="caret">▾</span></button>
              <div class="submenu" id="colorMenu" hidden>

/* ============ 色卡品牌集（可切换） ============ */
const PALETTES = {
  mard:   { name:'MARD 漫得',   count: MARD.length,   list: MARD },
  artkal: { name:'Artkal 阿卡', count: ARTKAL.length, list: ARTKAL },
  hama:   { name:'Hama 哈马',   count: HAMA.length,   list: HAMA },
  perler: { name:'Perler 珀勒', count: PERLER.length, list: PERLER }
};
/* 当前色卡（switchPalette 会重建 RGB） */
let PAL = 'mard';
let MARD_MODE = '291'; // '221' | '291'
let RGB = [];
function mardList(){ return MARD_MODE==='221' ? MARD_221 : MARD; }
function setPalette(key){
  PAL = key;
  const list = key==='mard' ? mardList() : PALETTES[key].list;
  RGB = list.map(([code,hex])=>{
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    return {code,hex,r,g,b};
  });
}
setPalette('mard');

/* 自然排序：S100 排在 S10 之后（按数字而非字典序） */
function codeSort(a,b){
  const pa=String(a).match(/^([A-Za-z]+)(\d+)$/), pb=String(b).match(/^([A-Za-z]+)(\d+)$/);
  if(pa&&pb){ if(pa[1]!==pb[1]) return pa[1]<pb[1]?-1:1; return (+pa[2])-(+pb[2]); }
  return a<b?-1:a>b?1:0;
}

/* ============ 颜色距离（redmean 加权，贴近人眼感知） ============ */
function dist(r1,g1,b1,r2,g2,b2){
  const rm=(r1+r2)/2;
  const dr=r1-r2, dg=g1-g2, db=b1-b2;
  return Math.sqrt((2+rm/256)*dr*dr + 4*dg*dg + (2+(255-rm)/256)*db*db);
}
function matchColor(r,g,b){
  let best=0, bd=Infinity;
  for(let i=0;i<RGB.length;i++){
    const c=RGB[i], d=dist(r,g,b,c.r,c.g,c.b);
    if(d<bd){bd=d;best=i;}
  }
  return best;
}

/* 按色号长度自适应字号：Perler 80-xxxxx(8字符)等长码不溢出格子 */
function codeFont(cell, code){
  const len=String(code).length;
  let fs = cell>28 ? 11 : 9;
  if(len>=8) fs=Math.min(fs, cell*0.22);
  else if(len>=6) fs=Math.min(fs, cell*0.27);
  else if(len>=5) fs=Math.min(fs, cell*0.32);
  return fs;
}

/* ============ 状态 ============ */
let img=null, imgW=0, imgH=0, grid=null, gridW=0, gridH=0;
let appliedGrid=null, appliedW=0, appliedH=0; // 已「应用」的正式网格（下载用它；滑杆预览不覆盖它）
let showCode=true, showGrid=true;
let bgColors=[]; // 手动拾取的背景色列表 [{r,g,b},...]，空=未拾取（退回四角自动检测）
let crop=null; // 裁切区域 {x,y,w,h} 相对原图 0~1 比例, null=全图

/* 当前有效源宽高比（裁切后按裁切区域算） */
function effRatio(){
  if(crop) return (crop.h*imgH)/(crop.w*imgW);
  return imgH/imgW;
}

const $=id=>document.getElementById(id);
const drop=$('drop'), file=$('file'), thumb=$('thumb'), thumbImg=$('thumbImg'), thumbMeta=$('thumbMeta');
const canvas=$('canvas'), ctx=canvas.getContext('2d');

/* 颜色数量限制：超出时把低频色号并入最近的保留色号 */
function applyColorLimit(grid, w, h, limit){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  if(freq.size<=limit) return grid;
  // 按频次排序，保留前 limit 个高频色
  const order=[...freq.entries()].sort((a,b)=>b[1]-a[1]);
  const keep=new Set(order.slice(0,limit).map(e=>e[0]));
  const map=new Array(grid.length);
  for(let i=0;i<grid.length;i++){
    const g=grid[i];
    if(g<0 || keep.has(g)){ map[i]=g; continue; }
    // 并入最近的保留色号
    const c=RGB[g]; let b=-1,bd=Infinity;
    keep.forEach(k=>{ const kk=RGB[k], d=dist(c.r,c.g,c.b,kk.r,kk.g,kk.b); if(d<bd){bd=d;b=k;} });
    map[i]=b;
  }
  return map;
}

/* 画板形状判断（返回该格是否保留） */
function shapeKeep(x,y,w,h,shape){
  if(shape==='rect') return true;
  const cx=(w-1)/2, cy=(h-1)/2;
  if(shape==='circle'){
    const rx=w/2, ry=h/2;
    const nx=(x-cx)/rx, ny=(y-cy)/ry;
    return nx*nx+ny*ny<=1;
  }
  if(shape==='hex'){
    // 六边形：以中心为原点，横向扁平，用轴向距离近似
    const nx=Math.abs(x-cx)/(w/2), ny=Math.abs(y-cy)/(h/2);
    // 正六边形：|x|/a + |y|/b <= 1 且顶点收敛 → 用 max(|nx|,|ny|) 与内切判断
    return (Math.abs(nx)+0.5*Math.abs(ny))<=1 && (0.5*Math.abs(nx)+Math.abs(ny))<=1;
  }
  return true;
}

function hex2rgb(hex){ return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)]; }

/* 调色：亮度/对比度/饱和度 */
function adjust(r,g,b,bri,con,sat){
  // 亮度
  if(bri){ const o=bri*1.28; r+=o; g+=o; b+=o; }
  // 对比度
  if(con){ const f=(259*(con+255))/(255*(259-con)); r=f*(r-128)+128; g=f*(g-128)+128; b=f*(b-128)+128; }
  // 饱和度
  if(sat){
    const s=sat/100;
    const gray=0.299*r+0.587*g+0.114*b;
    r=gray+(r-gray)*(1+s); g=gray+(g-gray)*(1+s); b=gray+(b-gray)*(1+s);
  }
  return [Math.max(0,Math.min(255,r)),Math.max(0,Math.min(255,g)),Math.max(0,Math.min(255,b))];
}

function generate(commit){
  if(!img) return;
  if(commit!==false && window.__resetZoom) window.__resetZoom();
  const w=+$('width').value, h=+$('height').value;
  const keep=$('keepRatio').checked;
  const limit=+$('colorLimit').value;
  const shape=$('shape').querySelector('.on').dataset.v;
  const removeBg=$('removeBg').checked;
  const dither=$('dither').checked;
  const bri=+$('brightness').value, con=+$('contrast').value, sat=+$('saturation').value;

  // 采样：把原图（或裁切区域）缩到 w×h
  const off=document.createElement('canvas'); off.width=w; off.height=h;
  const octx=off.getContext('2d');
  octx.imageSmoothingEnabled=true; octx.imageSmoothingQuality='high';
  if(crop){
    const sx=crop.x*imgW, sy=crop.y*imgH, sw=crop.w*imgW, sh=crop.h*imgH;
    octx.drawImage(img, sx,sy,sw,sh, 0,0,w,h);
  } else {
    octx.drawImage(img,0,0,imgW,imgH,0,0,w,h);
  }
  const data=octx.getImageData(0,0,w,h).data;

  gridW=w; gridH=h;
  grid=new Array(w*h);
  // 抖动误差缓冲（Floyd-Steinberg 需记录各像素累计 RGB 误差，用 Float32Array 存 r/g/b）
  const err = dither ? new Float32Array(w*h*3) : null;
  for(let i=0;i<w*h;i++){
    const p=i*4;
    const a=data[p+3];
    if(a<40){ grid[i]=-1; continue; } // 透明/空白
    let r,g,b;
    if(dither){ r=err[i*3]+data[p]; g=err[i*3+1]+data[p+1]; b=err[i*3+2]+data[p+2]; }
    else { r=data[p]; g=data[p+1]; b=data[p+2]; }
    let [ar,ag,ab]=adjust(r,g,b,bri,con,sat);
    const idx=matchColor(ar,ag,ab);
    grid[i]=idx;
    if(dither && idx>=0){
      const c=RGB[idx];
      // 量化误差 = 原始(含累计误差) - 匹配色号
      const er=ar-c.r, eg=ag-c.g, eb=ab-c.b;
      const x=i%w, y=(i/w)|0;
      // Floyd-Steinberg：右7/16 下5/16 左下3/16 右下1/16
      const spread=(dx,dy,k)=>{ const nx=x+dx, ny=y+dy; if(nx<0||nx>=w||ny<0||ny>=h) return; const ni=ny*w+nx; if(data[ni*4+3]<40) return; err[ni*3]+=er*k; err[ni*3+1]+=eg*k; err[ni*3+2]+=eb*k; };
      spread(1,0,7/16); spread(0,1,5/16); spread(-1,1,3/16); spread(1,1,1/16);
    }
  }

  // 去背景：优先用「手动拾取」的背景色列表；未拾取时退回四角平均色。
  // 对比「原始像素」而非匹配后的色号色，更贴合拾取到的背景；阈值放宽以覆盖近白等 JPEG 噪声
  if(removeBg){
    let targets=bgColors.slice();
    if(targets.length===0){
      const corners=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]];
      let sr=0,sg=0,sb=0,n=0;
      corners.forEach(([cx,cy])=>{ const p=(cy*w+cx)*4; if(data[p+3]>=40){ sr+=data[p];sg+=data[p+1];sb+=data[p+2];n++; } });
      if(n) targets=[{r:sr/n,g:sg/n,b:sb/n}];
    }
    for(let i=0;i<w*h;i++){
      if(grid[i]<0) continue;
      const p=i*4;
      const r=data[p],g=data[p+1],b=data[p+2];
      for(const t of targets){ if(dist(r,g,b,t.r,t.g,t.b)<48){ grid[i]=-1; break; } }
    }
  }

  // 颜色数量限制
  if(limit<48) grid=applyColorLimit(grid,w,h,limit);

  // 形状裁切（置空形状外格）
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(!shapeKeep(x,y,w,h,shape)) grid[y*w+x]=-1; }

  draw();
  buildStats();
  updateDims(w,h);
  $('toolbar').style.display='flex';
  $('placeholder').style.display='none';
  if(commit!==false){ commitGrid(); clearPending(); }
}

// 把当前网格快照为「已应用」正式结果（下载/导出用它）
function commitGrid(){ appliedGrid=grid; appliedW=gridW; appliedH=gridH; }
// 在已应用网格上执行导出：临时切换 grid 到 appliedGrid，结束后还原
function useApplied(fn){
  const _g=grid, _w=gridW, _h=gridH;
  grid=(appliedGrid||grid); gridW=(appliedW||gridW); gridH=(appliedH||gridH);
  try { fn(); } finally { grid=_g; gridW=_w; gridH=_h; }
}

/* ============ 绘制 ============ */
function draw(){
  const w=gridW, h=gridH; if(!w) return;
  const cell=36; // 每格像素
  const pad=28; // 边距（放坐标刻度）
  const cw=pad*2+w*cell, ch=pad*2+h*cell;
  canvas.width=cw; canvas.height=ch;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cw,ch);

  // 格子
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const g=grid[y*w+x];
    const px=pad+x*cell, py=pad+y*cell;
    if(g<0){ ctx.fillStyle='#f4f5f7'; ctx.fillRect(px,py,cell,cell); }
    else { ctx.fillStyle=RGB[g].hex; ctx.fillRect(px,py,cell,cell); }
  }
  // 网格线
  if(showGrid){
    ctx.strokeStyle='rgba(120,128,140,.28)'; ctx.lineWidth=1;
    ctx.beginPath();
    for(let x=0;x<=w;x++){ const px=pad+x*cell; ctx.moveTo(px,pad); ctx.lineTo(px,pad+h*cell); }
    for(let y=0;y<=h;y++){ const py=pad+y*cell; ctx.moveTo(pad,py); ctx.lineTo(pad+w*cell,py); }
    ctx.stroke();
  }
  // 色号标注
  if(showCode){
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let y=0;y<h;y++) for(let x=0;x<w;x++){
      const g=grid[y*w+x]; if(g<0) continue;
      const c=RGB[g];
      const fs=codeFont(cell,c.code);
      ctx.font=`700 ${fs}px "Microsoft YaHei",sans-serif`;
      const lum=0.299*c.r+0.587*c.g+0.114*c.b;
      ctx.fillStyle=lum>150?'rgba(30,35,45,.82)':'rgba(255,255,255,.92)';
      ctx.fillText(c.code, pad+x*cell+cell/2, pad+y*cell+cell/2);
    }
  }
  // 坐标刻度
  ctx.fillStyle='#9aa2b1'; ctx.font='10px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let x=0;x<w;x++){ if(x%5===0) ctx.fillText(String(x+1), pad+x*cell+cell/2, pad-12); }
  for(let y=0;y<h;y++){ if(y%5===0) ctx.fillText(String(y+1), pad-14, pad+y*cell+cell/2); }
}

/* ============ 统计 ============ */
function buildStats(){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  const total=[...freq.values()].reduce((a,b)=>a+b,0);
  const arr=[...freq.entries()].sort((a,b)=>codeSort(RGB[a[0]].code,RGB[b[0]].code));
  $('statsTitle').textContent=`色号对照统计（${arr.length} 色 · 共 ${total} 颗豆子）`;
  $('totalBeads').textContent=total;
  $('beadTotal').style.display='inline-flex';
  if($('genMeta')) $('genMeta').innerHTML=`<b>${gridW} × ${gridH}</b> 格 · 共 <b>${total}</b> 颗豆子`;
  const box=$('stats'); box.innerHTML='';
  if(arr.length===0){ box.innerHTML='<div class="stat-empty">无有效色号</div>'; return; }
  $('statsWrap').style.display='block';
  arr.forEach(([g,n])=>{
    const c=RGB[g];
    const el=document.createElement('div'); el.className='stat';
    el.innerHTML=`<div class="swatch" style="background:${c.hex}"></div><span class="code">${c.code}</span><span class="n">${n}颗</span>`;
    el.title=c.hex;
    box.appendChild(el);
  });
}

function updateDims(w,h){
  const size=+($('beadSize').querySelector('.on').dataset.v);
  $('dimsText').textContent=`${w} × ${h} 格`;
  $('sizeText').textContent=`${(w*size/10).toFixed(1)} × ${(h*size/10).toFixed(1)} cm`;
}

/* ============ 导出 ============ */
/* 绘制图纸到一个 canvas（withCode=是否带色号标注），返回 canvas */
function renderBoard(cell, pad, withCode){
  const w=gridW, h=gridH;
  const cw=pad*2+w*cell, ch=pad*2+h*cell;
  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);
  for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){
    const g=grid[y*w+xx]; const px=pad+xx*cell, py=pad+y*cell;
    x.fillStyle=g<0?'#f4f5f7':RGB[g].hex; x.fillRect(px,py,cell,cell);
  }
  if(withCode){
    x.strokeStyle='rgba(120,128,140,.25)'; x.lineWidth=1;
    x.beginPath();
    for(let xx=0;xx<=w;xx++){const px=pad+xx*cell;x.moveTo(px,pad);x.lineTo(px,pad+h*cell);}
    for(let y=0;y<=h;y++){const py=pad+y*cell;x.moveTo(pad,py);x.lineTo(pad+w*cell,py);}
    x.stroke();
    x.textAlign='center'; x.textBaseline='middle';
    for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){
      const g=grid[y*w+xx]; if(g<0) continue;
      const cc=RGB[g], lum=0.299*cc.r+0.587*cc.g+0.114*cc.b;
      const fs=codeFont(cell,cc.code);
      x.font=`700 ${fs}px "Microsoft YaHei",sans-serif`;
      x.fillStyle=lum>150?'rgba(30,35,45,.82)':'rgba(255,255,255,.92)';
      x.fillText(cc.code, pad+xx*cell+cell/2, pad+y*cell+cell/2);
    }
    // 坐标刻度
    x.fillStyle='#9aa2b1'; x.font='10px "Microsoft YaHei",sans-serif';
    for(let xx=0;xx<w;xx++){ if(xx%5===0) x.fillText(String(xx+1), pad+xx*cell+cell/2, pad-12); }
    for(let y=0;y<h;y++){ if(y%5===0) x.fillText(String(y+1), pad-14, pad+y*cell+cell/2); }
  }
  return c;
}

/* 统计条目（按色号排序） */
function statsEntries(){
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  return [...freq.entries()].sort((a,b)=>codeSort(RGB[a[0]].code,RGB[b[0]].code));
}

/* 完整导出：标题 + 拼豆格图 + 色号对照统计清单 合成一张 */
function exportPng(){
  useApplied(()=>{
  const w=gridW,h=gridH; if(!w) return;
  const size=+($('beadSize').querySelector('.on').dataset.v);
  const cell=30, pad=26;
  const board=renderBoard(cell,pad,true);
  const entries=statsEntries();

  const perRow=6, itemW=150, itemH=40, gap=10;
  const rows=Math.max(1,Math.ceil(entries.length/perRow));
  const statsW=perRow*itemW+(perRow-1)*gap;
  const margin=30;
  const titleH=86, statsTitleH=52;
  const cw=Math.max(board.width, statsW)+margin*2;
  const ch=titleH+board.height+statsTitleH+rows*(itemH+gap)+margin*2;

  const c=document.createElement('canvas'); c.width=cw; c.height=ch;
  const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch);

  // 标题
  x.fillStyle='#1c2128'; x.textAlign='center'; x.textBaseline='alphabetic';
  x.font='800 26px "Microsoft YaHei",sans-serif';
  x.fillText('拼豆色号图纸', cw/2, 42);
  x.fillStyle='#7c8595'; x.font='14px "Microsoft YaHei",sans-serif';
  x.fillText(`${w} × ${h} 格 · 迷你豆 ${size}mm · 成品约 ${(w*size/10).toFixed(1)} × ${(h*size/10).toFixed(1)} cm`, cw/2, 68);

  // 图纸
  const bx=(cw-board.width)/2, by=titleH+14;
  x.drawImage(board, bx, by);

  // 统计标题
  const sy=by+board.height+22;
  x.fillStyle='#1c2128'; x.textAlign='left';
  x.font='800 18px "Microsoft YaHei",sans-serif';
  const totalBeads=entries.reduce((a,[,n])=>a+n,0);
  x.fillText(`色号对照统计（共 ${entries.length} 色 · 需 ${totalBeads} 颗豆子）`, margin, sy+16);

  // 统计条目
  const sx=(cw-statsW)/2, sy2=sy+44;
  entries.forEach(([g,n],i)=>{
    const col=i%perRow, row=Math.floor(i/perRow);
    const ix=sx+col*(itemW+gap), iy=sy2+row*(itemH+gap);
    const cc=RGB[g];
    x.fillStyle='#f8f9fb';
    x.strokeStyle='#e6e8ee'; x.lineWidth=1;
    x.fillRect(ix,iy,itemW,itemH);
    x.strokeRect(ix,iy,itemW,itemH);
    x.fillStyle=cc.hex;

function exportCsv(){
  useApplied(()=>{
  const w=gridW,h=gridH; if(!w) return;
  let lines=[];
  for(let y=0;y<h;y++){
    const row=[];
    for(let x=0;x<w;x++){ const g=grid[y*w+x]; row.push(g<0?'':RGB[g].code); }
    lines.push(row.join(','));
  }
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.download=`拼豆色号矩阵_${w}x${h}.csv`;
  a.href=URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  });
}

/* 购物清单：色号 + 颗数 + 颜色hex，按色号自然排序，末尾合计 */
function exportShopList(){
  useApplied(()=>{
  const w=gridW,h=gridH; if(!w) return;
  const freq=new Map();
  for(const g of grid) if(g>=0) freq.set(g,(freq.get(g)||0)+1);
  const arr=[...freq.entries()].sort((a,b)=>codeSort(RGB[a[0]].code,RGB[b[0]].code));
  const total=arr.reduce((a,[,n])=>a+n,0);
  const lines=['色号,颗数,颜色'];
  arr.forEach(([g,n])=>{ lines.push(`${RGB[g].code},${n},${RGB[g].hex}`); });
  lines.push(`合计,${total},`);
  const csv='﻿'+lines.join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.download=`拼豆购物清单_${w}x${h}.csv`;
  a.href=URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
  });
}

function setPending(btn, on){
  const lbl=btn.querySelector('.lbl');
  if(on){ btn.classList.add('pending'); if(lbl) lbl.textContent='应用更改 · 待应用'; else btn.textContent='应用更改 · 待应用'; }
  else { btn.classList.remove('pending'); if(lbl) lbl.textContent='应用更改'; else btn.textContent='应用更改'; }
}
function markPending(btn){ if(!img) return; setPending(btn,true); }
function clearPending(){ setPending($('applySize'),false); setPending($('applyColor'),false); setPending($('applyTone'),false); }
let previewPending=false;
function schedulePreview(btn){
  if(!img) return;
  markPending(btn);
  if(previewPending) return;
  previewPending=true;
  requestAnimationFrame(()=>{ previewPending=false; generate(false); });
}
function bindRange(id, valId, fmt, onLive){
  $(id).addEventListener('input',()=>{ $(valId).textContent=fmt(+$(id).value); if(onLive) onLive(); });

}
/* 按原图比例双向联动：fromW=true 改宽同步高, false 改高同步宽 */

  } else {
    $('width').value=Math.max(8,Math.min(200,Math.round((+$('height').value)/r)));
    $('wVal').textContent=$('width').value;

}

// 进入裁切模式：按当前 crop(或默认居中 80%) 铺框
function enterCrop(){
  if(!img) return;
  const dw=cropWrap.clientWidth, dh=cropWrap.clientHeight;
  const r = crop || {x:0.1,y:0.1,w:0.8,h:0.8};
  setBox(r.x*dw, r.y*dh, r.w*dw, r.h*dh);
  cropBox.style.display='block';
  cropToggle.style.display='none';
  cropApply.style.display='inline-block';
  cropReset.style.display='inline-block';
}
function exitCrop(apply){
  cropBox.style.display='none';
  cropApply.style.display='none';
  cropReset.style.display='none';
  cropToggle.style.display='inline-block';
  if(apply){
    const dw=cropWrap.clientWidth, dh=cropWrap.clientHeight;
    const left=parseFloat(cropBox.style.left), top=parseFloat(cropBox.style.top);
    const bw=parseFloat(cropBox.style.width), bh=parseFloat(cropBox.style.height);
    crop = { x:left/dw, y:top/dh, w:bw/dw, h:bh/dh };
    cropToggle.textContent='重新裁切';
    if($('keepRatio').checked){ $('height').value=Math.max(8,Math.min(200,Math.round((+$('width').value)*effRatio()))); $('hVal').textContent=$('height').value; }
    generate();
  }
}
function setBox(left,top,w,h){
  cropBox.style.left=left+'px'; cropBox.style.top=top+'px';
  cropBox.style.width=w+'px'; cropBox.style.height=h+'px';
}

cropToggle.addEventListener('click',enterCrop);
cropApply.addEventListener('click',()=>exitCrop(true));
cropReset.addEventListener('click',()=>exitCrop(false));

// 拖拽：框体移动 / 手柄缩放
let cropDrag=null;
cropBox.addEventListener('pointerdown',e=>{
  if(cropBox.style.display==='none') return;
  e.preventDefault();
  const h=e.target.dataset.h || null; // 命中手柄时是方向, 否则移动整个框
  const dw=cropWrap.clientWidth, dh=cropWrap.clientHeight;
  const left=parseFloat(cropBox.style.left), top=parseFloat(cropBox.style.top);
  const w=parseFloat(cropBox.style.width), hh=parseFloat(cropBox.style.height);
  cropDrag={ h, sx:e.clientX, sy:e.clientY, left, top, w, hh, dw, dh };
  cropBox.setPointerCapture(e.pointerId);
});
cropBox.addEventListener('pointermove',e=>{
  if(!cropDrag) return;
  const dx=e.clientX-cropDrag.sx, dy=e.clientY-cropDrag.sy;
  const {h,dw,dh}=cropDrag;
  let left=cropDrag.left, top=cropDrag.top, w=cropDrag.w, hh=cropDrag.hh;
  const MIN=10;
  if(!h){ // 移动整体
    left=Math.max(0,Math.min(cropDrag.left+dx, dw-cropDrag.w));
    top=Math.max(0,Math.min(cropDrag.top+dy, dh-cropDrag.hh));
  } else {
    if(h.includes('w')){ const nl=Math.max(0,Math.min(cropDrag.left+dx, cropDrag.left+cropDrag.w-MIN)); w=cropDrag.w+(cropDrag.left-nl); left=nl; }
    if(h.includes('e')){ w=Math.max(MIN,Math.min(cropDrag.w+dx, dw-cropDrag.left)); }
    if(h.includes('n')){ const nt=Math.max(0,Math.min(cropDrag.top+dy, cropDrag.top+cropDrag.hh-MIN)); hh=cropDrag.hh+(cropDrag.top-nt); top=nt; }
    if(h.includes('s')){ hh=Math.max(MIN,Math.min(cropDrag.hh+dy, dh-cropDrag.top)); }
  }
  setBox(left,top,w,hh);
});
cropBox.addEventListener('pointerup',()=>{ cropDrag=null; });
cropBox.addEventListener('pointercancel',()=>{ cropDrag=null; });

/* ============ 手机端：滚动到结果 + 结果画布捏合缩放 ============ */
function isCoarse(){ return !!(window.matchMedia && window.matchMedia('(hover:none),(pointer:coarse)').matches); }
function scrollToResult(){
  if(!isCoarse()) return;
  const right=document.querySelector('.right');
  if(right) right.scrollIntoView({behavior:'smooth', block:'start'});
}
function initStageZoom(){
  if(!isCoarse()) return;
  const stage=document.querySelector('.stage');
  const cv=$('canvas');
  const badge=$('zoomBadge');
  if(!stage||!cv) return;
  let scale=1, tx=0, ty=0;
  const MIN=1, MAX=6;
  const pointers=new Map();
  let pinch=null, drag=null, lastTap=0;
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  function apply(){
    cv.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;
    if(badge){
      if(scale>1.02){ badge.textContent=Math.round(scale*100)+'%'; badge.style.display='block'; }
      else badge.style.display='none';
    }
  }
  function clamp(){
    const baseW=cv.offsetWidth||1, baseH=cv.offsetHeight||1;
    const vw=stage.clientWidth||1, vh=stage.clientHeight||1;
    const cw=baseW*scale, ch=baseH*scale;
    if(cw<=vw) tx=(vw-cw)/2; else tx=Math.min(0,Math.max(vw-cw,tx));
    if(ch<=vh) ty=(vh-ch)/2; else ty=Math.min(0,Math.max(vh-ch,ty));
  }
  cv.addEventListener('pointerdown',e=>{
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const p=[...pointers.values()];
      pinch={d:dist(p[0],p[1]),mid:mid(p[0],p[1]),scale,tx,ty}; drag=null;
    } else if(pointers.size===1){
      drag={x:e.clientX,y:e.clientY,tx,ty}; pinch=null;
    }
  });
  cv.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pinch && pointers.size===2){
      const p=[...pointers.values()];
      const d=dist(p[0],p[1]); if(d<1) return;
      const m=mid(p[0],p[1]);
      const ns=Math.min(MAX,Math.max(MIN,pinch.scale*d/pinch.d));
      const f=ns/pinch.scale;
      tx=m.x-(pinch.mid.x-pinch.tx)*f;
      ty=m.y-(pinch.mid.y-pinch.ty)*f;
      scale=ns; clamp(); apply();
    } else if(drag && pointers.size===1){
      tx=drag.tx+(e.clientX-drag.x);
      ty=drag.ty+(e.clientY-drag.y);
      clamp(); apply();
    }
  });
  const up=e=>{ pointers.delete(e.pointerId); if(pointers.size<2) pinch=null; if(pointers.size===0) drag=null; };
  cv.addEventListener('pointerup',up);
  cv.addEventListener('pointercancel',up);
  // 双击：放大 ↔ 复位
  cv.addEventListener('click',e=>{
    const now=Date.now();
    if(now-lastTap<320){
      lastTap=0;
      if(scale>MIN){ scale=MIN; tx=0; ty=0; }
      else{
        scale=2.5;
        const r=cv.getBoundingClientRect();
        tx=(e.clientX-r.left)*(1-scale); ty=(e.clientY-r.top)*(1-scale);
      }
      clamp(); apply();
    } else lastTap=now;
  });
  window.__resetZoom=function(){ scale=1; tx=0; ty=0; apply(); };
}
$('genBarBtn').addEventListener('click',()=>{ generate(); scrollToResult(); });
initStageZoom();

// 任意设置变化都保存（change 捕获 checkbox/select/range 松手; click 捕获按钮切换; input 捕获 range 拖动）
['change','click','input'].forEach(ev=>{
  document.addEventListener(ev, e=>{
    const t=e.target;
    if(t && t.closest && t.closest('#settingsCard,#brand')) saveSettings();
  });
});
</script>
